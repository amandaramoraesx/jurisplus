# Configuração do Firebase App Hosting.
# FIREBASE_PRIVATE_KEY não fica aqui (é sensível) — é configurada manualmente
# no Console do Firebase (App Hosting > backend jurisplus > variáveis de ambiente).
env:
  - variable: FIREBASE_PROJECT_ID
    value: juris-plus
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_CLIENT_EMAIL
    value: firebase-adminsdk-fbsvc@juris-plus.iam.gserviceaccount.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDhLXf8lXbgJDZDtJLKFUMrhhI1ILUEPZw
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: juris-plus.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: juris-plus
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_STORAGE_BUCKET
    value: juris-plus.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
